name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snumpr-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart production site
    runs-on: [self-hosted, snumpr-deploy]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: /home/jonghyunchoi/snumpr
    steps:
      - name: Update source
        run: git pull --ff-only

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Restart website
        run: sudo -n /usr/bin/systemctl restart snumpr

      - name: Check website health
        run: |
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:3000 > /dev/null
